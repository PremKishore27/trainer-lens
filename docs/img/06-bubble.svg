<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 684" width="360" height="684" role="img" aria-label="Overlay bubble over the game"><title>Overlay bubble over the game</title><rect x="0" y="0" width="360" height="684" rx="0" fill="#eef0f4"/><rect x="10" y="10" width="340" height="620" rx="26" fill="#fff" stroke="#9aa0a6" stroke-width="3"/><clipPath id="s"><rect x="14" y="14" width="332" height="612" rx="22"/></clipPath><g clip-path="url(#s)"><rect x="0" y="0" width="360" height="640" rx="0" fill="#d7e6d4"/><rect x="20" y="120" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="72" y="160" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="124" y="120" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="176" y="160" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="228" y="120" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="280" y="160" width="40" height="40" rx="10" fill="#c2d6bf"/><text x="180" y="600" font-size="10" fill="#6b7f68" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">(stand-in for the game map – not game artwork)</text><text x="28" y="34" font-size="11" fill="#5f6368" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">9:41</text><text x="332" y="34" font-size="9" fill="#5f6368" font-weight="normal" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">▮▮▮</text><circle cx="300" cy="300" r="26" fill="#1e6fd9" stroke="#fff" stroke-width="3"/><g transform="translate(300,300) scale(1.3)"><circle cx="-3" cy="-3" r="9" fill="none" stroke="#fff" stroke-width="3.2"/><line x1="4" y1="4" x2="12" y2="12" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></g><circle cx="270" cy="275" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="270" y="280" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1</text><text x="180" y="330" font-size="1" fill="#1c1b1f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif"></text><rect x="24" y="380" width="312" height="110" rx="16" fill="#ffffffee" stroke="#cfcfd4" stroke-width="1.5"/><text x="40" y="410" font-size="12.5" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1. Drag the bubble anywhere you like.</text><text x="40" y="432" font-size="12.5" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">2. Tap it to open the window.</text><text x="40" y="454" font-size="12.5" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">3. Tap – (top bar) to shrink it back.</text></g><text x="180.0" y="658" font-size="12" fill="#3c4043" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">The 🔍 bubble sits on top of the game</text><text x="180.0" y="675" font-size="10" fill="#80868b" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Illustration – not a real screenshot</text></svg>