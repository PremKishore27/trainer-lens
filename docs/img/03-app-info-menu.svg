<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 684" width="360" height="684" role="img" aria-label="Android App info page with the three-dot menu"><title>Android App info page with the three-dot menu</title><rect x="0" y="0" width="360" height="684" rx="0" fill="#eef0f4"/><rect x="10" y="10" width="340" height="620" rx="26" fill="#fff" stroke="#9aa0a6" stroke-width="3"/><clipPath id="s"><rect x="14" y="14" width="332" height="612" rx="22"/></clipPath><g clip-path="url(#s)"><text x="28" y="34" font-size="11" fill="#5f6368" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">9:41</text><text x="332" y="34" font-size="9" fill="#5f6368" font-weight="normal" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">▮▮▮</text><text x="28" y="70" font-size="20" fill="#1c1b1f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">←</text><text x="300" y="70" font-size="22" fill="#1c1b1f" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">⋮</text><circle cx="180" cy="130" r="28" fill="#1e6fd9"/><g transform="translate(180,130) scale(1.6)"><circle cx="-3" cy="-3" r="9" fill="none" stroke="#fff" stroke-width="3.2"/><line x1="4" y1="4" x2="12" y2="12" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></g><text x="180" y="182" font-size="17" fill="#1c1b1f" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Trainer Lens</text><rect x="24" y="206" width="312" height="50" rx="14" fill="#f3edf7"/><text x="40" y="236" font-size="13" fill="#1c1b1f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Notifications</text><rect x="24" y="262" width="312" height="50" rx="14" fill="#f3edf7"/><text x="40" y="292" font-size="13" fill="#1c1b1f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Permissions</text><rect x="24" y="318" width="312" height="50" rx="14" fill="#f3edf7"/><text x="40" y="348" font-size="13" fill="#1c1b1f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Storage &amp; cache</text><rect x="150" y="82" width="186" height="100" rx="12" fill="#fff" stroke="#cfcfd4" stroke-width="1.5"/><text x="166" y="112" font-size="13" fill="#1c1b1f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Uninstall</text><text x="166" y="144" font-size="13" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Allow restricted settings</text><rect x="154" y="124" width="178" height="30" rx="8" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="7 4"/><circle cx="140" cy="139" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="140" y="144" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">2</text><rect x="282" y="52" width="36" height="30" rx="15" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="7 4"/><circle cx="276" cy="46" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="276" y="51" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1</text><text x="28" y="420" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1. Tap the three dots (top right).</text><text x="28" y="438" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">2. Tap Allow restricted settings,</text><text x="28" y="456" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">    confirm with PIN or fingerprint.</text><text x="28" y="490" font-size="11" fill="#d93025" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Menu has no such option?</text><text x="28" y="506" font-size="11" fill="#d93025" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Do step 2 first (tap Allow, then OK on</text><text x="28" y="522" font-size="11" fill="#d93025" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">the "Restricted setting" message),</text><text x="28" y="538" font-size="11" fill="#d93025" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">come back here and open ⋮ again.</text></g><text x="180.0" y="658" font-size="12" fill="#3c4043" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Step 3: App info → ⋮ → Allow restricted settings</text><text x="180.0" y="675" font-size="10" fill="#80868b" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Illustration – not a real screenshot</text></svg>