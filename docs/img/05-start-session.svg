<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 684" width="360" height="684" role="img" aria-label="Screen recording permission dialog"><title>Screen recording permission dialog</title><rect x="0" y="0" width="360" height="684" rx="0" fill="#eef0f4"/><rect x="10" y="10" width="340" height="620" rx="26" fill="#fff" stroke="#9aa0a6" stroke-width="3"/><clipPath id="s"><rect x="14" y="14" width="332" height="612" rx="22"/></clipPath><g clip-path="url(#s)"><rect x="0" y="0" width="360" height="640" rx="0" fill="#555a62"/><rect x="30" y="170" width="300" height="290" rx="24" fill="#fff"/><text x="50" y="208" font-size="15" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Start recording or casting</text><text x="50" y="228" font-size="15" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">with Trainer Lens?</text><text x="50" y="254" font-size="11" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">While recording, Android can capture</text><text x="50" y="270" font-size="11" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">everything visible on your screen.</text><rect x="50" y="296" width="260" height="40" rx="8" fill="#f3edf7"/><text x="64" y="321" font-size="13" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Entire screen  ▾</text><rect x="46" y="292" width="268" height="48" rx="10" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="7 4"/><circle cx="40" cy="292" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="40" y="297" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1</text><text x="190" y="410" font-size="13" fill="#6750a4" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Cancel</text><text x="268" y="410" font-size="13" fill="#6750a4" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Start now</text><rect x="224" y="392" width="88" height="28" rx="14" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="7 4"/><circle cx="320" cy="392" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="320" y="397" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">2</text><text x="180" y="500" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1. Pick "Entire screen"  2. Tap Start now</text><text x="180" y="520" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">The 🔍 bubble appears; open Pokémon GO.</text></g><text x="180.0" y="658" font-size="12" fill="#3c4043" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Step 5: Start session → Entire screen</text><text x="180.0" y="675" font-size="10" fill="#80868b" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Illustration – not a real screenshot</text></svg>