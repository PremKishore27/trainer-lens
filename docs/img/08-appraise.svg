<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 684" width="360" height="684" role="img" aria-label="Appraising a Pokémon in the game"><title>Appraising a Pokémon in the game</title><rect x="0" y="0" width="360" height="684" rx="0" fill="#eef0f4"/><rect x="10" y="10" width="340" height="620" rx="26" fill="#fff" stroke="#9aa0a6" stroke-width="3"/><clipPath id="s"><rect x="14" y="14" width="332" height="612" rx="22"/></clipPath><g clip-path="url(#s)"><rect x="0" y="0" width="360" height="640" rx="0" fill="#e3ecf5"/><text x="28" y="34" font-size="11" fill="#5f6368" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">9:41</text><text x="332" y="34" font-size="9" fill="#5f6368" font-weight="normal" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">▮▮▮</text><text x="300" y="70" font-size="22" fill="#334" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">☰</text><rect x="280" y="48" width="40" height="34" rx="17" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="7 4"/><circle cx="274" cy="44" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="274" y="49" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1</text><rect x="170" y="84" width="150" height="84" rx="10" fill="#fff" stroke="#cfcfd4" stroke-width="1.5"/><text x="184" y="110" font-size="12" fill="#1c1b1f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Transfer</text><text x="184" y="134" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Appraise</text><text x="184" y="158" font-size="12" fill="#1c1b1f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Favorite</text><rect x="176" y="118" width="138" height="24" rx="6" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="7 4"/><circle cx="166" cy="130" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="166" y="135" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">2</text><rect x="24" y="200" width="312" height="120" rx="14" fill="#fff" stroke="#cfcfd4" stroke-width="1.5"/><text x="40" y="226" font-size="11" fill="#334" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Overall, this Pokémon is…  (appraisal)</text><text x="40" y="256" font-size="11" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Attack</text><rect x="100" y="246" width="200" height="12" rx="6" fill="#dde3ea"/><rect x="100" y="246" width="200.0" height="12" rx="6" fill="#e8a33d"/><text x="40" y="280" font-size="11" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Defense</text><rect x="100" y="270" width="200" height="12" rx="6" fill="#dde3ea"/><rect x="100" y="270" width="173.33333333333334" height="12" rx="6" fill="#e8a33d"/><text x="40" y="304" font-size="11" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">HP</text><rect x="100" y="294" width="200" height="12" rx="6" fill="#dde3ea"/><rect x="100" y="294" width="173.33333333333334" height="12" rx="6" fill="#e8a33d"/><text x="28" y="350" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1. In the game, tap ☰ on the Pokémon.</text><text x="28" y="369" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">2. Tap Appraise and tap through until the</text><text x="28" y="388" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">    three bars show. Keep them on screen</text><text x="28" y="407" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">    for about a second.</text><text x="28" y="426" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">3. The card now says "exact" and also</text><text x="28" y="445" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">    names renamed Pokémon (the "caught on" line).</text></g><text x="180.0" y="658" font-size="12" fill="#3c4043" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">For exact IVs: ☰ → Appraise</text><text x="180.0" y="675" font-size="10" fill="#80868b" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Illustration – not a real screenshot</text></svg>