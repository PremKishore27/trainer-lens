<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 684" width="360" height="684" role="img" aria-label="Moving and resizing the overlay window"><title>Moving and resizing the overlay window</title><rect x="0" y="0" width="360" height="684" rx="0" fill="#eef0f4"/><rect x="10" y="10" width="340" height="620" rx="26" fill="#fff" stroke="#9aa0a6" stroke-width="3"/><clipPath id="s"><rect x="14" y="14" width="332" height="612" rx="22"/></clipPath><g clip-path="url(#s)"><rect x="0" y="0" width="360" height="640" rx="0" fill="#d7e6d4"/><rect x="20" y="120" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="72" y="160" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="124" y="120" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="176" y="160" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="228" y="120" width="40" height="40" rx="10" fill="#c2d6bf"/><rect x="280" y="160" width="40" height="40" rx="10" fill="#c2d6bf"/><text x="180" y="600" font-size="10" fill="#6b7f68" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">(stand-in for the game – not game artwork)</text><text x="28" y="34" font-size="11" fill="#5f6368" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">9:41</text><text x="332" y="34" font-size="9" fill="#5f6368" font-weight="normal" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">▮▮▮</text><rect x="40" y="200" width="280" height="220" rx="16" fill="#fbfbfdf2" stroke="#9aa0a6" stroke-width="1.5"/><rect x="40" y="200" width="280" height="30" rx="16" fill="#e8def8"/><rect x="40" y="214" width="280" height="16" rx="0" fill="#e8def8"/><rect x="48" y="205" width="80" height="20" rx="10" fill="#fff"/><rect x="48" y="205" width="40" height="20" rx="10" fill="#6750a4"/><text x="68" y="219" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">IV</text><rect x="88" y="205" width="40" height="20" rx="10" fill="#fff"/><text x="108" y="219" font-size="11" fill="#49454f" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Bag</text><text x="266" y="221" font-size="16" fill="#1c1b1f" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">–</text><text x="298" y="220" font-size="10" fill="#b3261e" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Stop</text><text x="60" y="300" font-size="12" fill="#80868b" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">(card content)</text><rect x="154.0" y="412" width="52" height="4" rx="2" fill="#9aa0a6"/><text x="180" y="192" font-size="12" fill="#d93025" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">① drag the top bar to MOVE</text><text x="180" y="444" font-size="12" fill="#d93025" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">② drag the bottom edge to RESIZE</text><path d="M180 450 L180 480 M172 472 L180 482 L188 472" stroke="#d93025" stroke-width="3" fill="none" stroke-linecap="round"/><text x="40" y="520" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">The window remembers its size and</text><text x="40" y="539" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">position (IV and Bag each remember theirs).</text><text x="40" y="558" font-size="12" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">On the IV tab it never covers the CP or HP line.</text></g><text x="180.0" y="658" font-size="12" fill="#3c4043" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Move and resize the window</text><text x="180.0" y="675" font-size="10" fill="#80868b" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Illustration – not a real screenshot</text></svg>