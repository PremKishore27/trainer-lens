<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 684" width="360" height="684" role="img" aria-label="Trainer Lens setup screen with its steps"><title>Trainer Lens setup screen with its steps</title><rect x="0" y="0" width="360" height="684" rx="0" fill="#eef0f4"/><rect x="10" y="10" width="340" height="620" rx="26" fill="#fff" stroke="#9aa0a6" stroke-width="3"/><clipPath id="s"><rect x="14" y="14" width="332" height="612" rx="22"/></clipPath><g clip-path="url(#s)"><text x="28" y="34" font-size="11" fill="#5f6368" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">9:41</text><text x="332" y="34" font-size="9" fill="#5f6368" font-weight="normal" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">▮▮▮</text><text x="28" y="70" font-size="20" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Trainer Lens</text><text x="28" y="88" font-size="11" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Set up once, then tap Start</text><rect x="24" y="100" width="312" height="62" rx="14" fill="#e8def8"/><circle cx="46" cy="126" r="13" fill="#cfc2f0"/><text x="46" y="131" font-size="13" fill="#1d192b" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1</text><text x="68" y="122" font-size="13" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Allow notifications</text><text x="68" y="140" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Android needs one while the</text><text x="68" y="154" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">screen is being read.</text><rect x="262" y="110" width="66" height="28" rx="14" fill="#d0bcff"/><text x="295" y="129" font-size="11" fill="#21005d" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Allow</text><rect x="24" y="170" width="312" height="78" rx="14" fill="#fff3cd" stroke="#d93025" stroke-width="2"/><circle cx="46" cy="196" r="13" fill="#cfc2f0"/><text x="46" y="201" font-size="13" fill="#1d192b" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">2</text><text x="68" y="192" font-size="13" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Display over other apps</text><text x="68" y="210" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Lets the bubble sit on top of</text><text x="68" y="224" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">the game. Tap Allow, pick Trainer</text><text x="68" y="238" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Lens, switch it on.</text><rect x="262" y="180" width="66" height="28" rx="14" fill="#d0bcff"/><text x="295" y="199" font-size="11" fill="#21005d" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Allow</text><rect x="24" y="256" width="312" height="78" rx="14" fill="#e8def8"/><circle cx="46" cy="282" r="13" fill="#cfc2f0"/><text x="46" y="287" font-size="13" fill="#1d192b" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">3</text><text x="68" y="278" font-size="13" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Only if step 2 was blocked</text><text x="68" y="296" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Open App info → ⋮ → Allow</text><text x="68" y="310" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">restricted settings, then repeat</text><text x="68" y="324" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">step 2.</text><rect x="262" y="266" width="66" height="28" rx="14" fill="#d0bcff"/><text x="295" y="285" font-size="11" fill="#21005d" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">App info</text><rect x="24" y="342" width="312" height="62" rx="14" fill="#e8def8"/><circle cx="46" cy="368" r="13" fill="#cfc2f0"/><text x="46" y="373" font-size="13" fill="#1d192b" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">4</text><text x="68" y="364" font-size="13" fill="#1c1b1f" font-weight="bold" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Keep running in background</text><text x="68" y="382" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Recommended: stops Android</text><text x="68" y="396" font-size="10.5" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">closing the overlay.</text><rect x="262" y="352" width="66" height="28" rx="14" fill="#d0bcff"/><text x="295" y="371" font-size="11" fill="#21005d" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Allow</text><rect x="24" y="420" width="312" height="52" rx="26" fill="#6750a4"/><text x="180" y="452" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">5 · Start session</text><text x="180" y="492" font-size="9.5" fill="#49454f" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Android asks to record the screen: choose "Entire screen".</text><circle cx="20" cy="131" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="20" y="136" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">1</text><circle cx="20" cy="209" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="20" y="214" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">2</text><circle cx="20" cy="295" r="13" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="20" y="300" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">3</text><text x="28" y="540" font-size="11" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Do the steps in order. Step 3 is only</text><text x="28" y="556" font-size="11" fill="#49454f" font-weight="normal" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">needed if step 2 says "Restricted setting".</text></g><text x="180.0" y="658" font-size="12" fill="#3c4043" font-weight="bold" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">The setup screen</text><text x="180.0" y="675" font-size="10" fill="#80868b" font-weight="normal" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">Illustration – not a real screenshot</text></svg>